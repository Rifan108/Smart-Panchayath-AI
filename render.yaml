services:
  - type: web
    name: kerala-smart-panchayat-ai
    runtime: python
    buildCommand: pip install -r requirements.txt && python data/generate_dataset.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 wsgi:server
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # Set this manually in Render Dashboard
      - key: DASH_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
 